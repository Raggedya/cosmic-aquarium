<!doctype html>
<html lang="en" data-collection="{{SLUG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <title>Cosmic Aquaria — {{NAME}}</title>
</head>
<body style="margin:0;background:#000;color:#b7ffc0;font-family:system-ui;display:grid;place-items:center;min-height:100vh">
  <p>Opening {{NAME}} in Cosmic Aquaria… <a style="color:inherit" href="{{BASE}}/">continue</a></p>
  <script>
    (()=>{const slug=document.documentElement.dataset.collection;const category=slug.startsWith('style-')?slug.slice(6):'';location.replace('{{BASE}}/'+(category?'?categories='+encodeURIComponent(category):''));})();
  </script>
</body>
</html>
