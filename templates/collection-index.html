<!doctype html>
<html lang="en" data-collection="{{SLUG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030515">
  <meta name="description" content="Enter {{NAME}} and discover an independent Bandcamp artist.">
  <title>Cosmic Aquaria — {{NAME}}</title>
  <link rel="stylesheet" href="{{BASE}}/assets/collection.css?v={{ASSET_VERSION}}">
  <script defer src="{{BASE}}/assets/collection.js?v={{ASSET_VERSION}}"></script>
</head>
<body>
  <main class="collection-aquarium" aria-label="{{NAME}} artist Aquarium" data-base="{{BASE}}">
    <div class="collection-atmosphere" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <header class="collection-title">
      <a class="collection-home" href="{{BASE}}/" aria-label="Return to Cosmic Aquaria home"><span aria-hidden="true">✦</span></a>
      <h1>{{NAME}}</h1><p>{{INSTRUCTION}}</p>
    </header>
    <section class="collection-portals" hidden aria-label="Choose how to drift through this location"></section>
    <div class="collection-field" hidden aria-label="Unknown artist objects"></div>
    <section class="collection-reveal" hidden aria-live="polite">
      <p>YOU FOUND</p><h2></h2><span>{{NAME}}</span>
      <button type="button" class="collection-enter">ENTER AQUARIUM</button>
      <button type="button" class="collection-release">RELEASE</button>
    </section>
    <p class="visually-hidden" role="status" aria-live="polite">Touch an unknown artist object.</p>
  </main>
</body>
</html>
