<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050314">
  <meta name="description" content="Enter Cosmic Aquaria and let independent music find you.">
  <title>Cosmic Aquaria — Enter Without Knowing</title>
  <link rel="stylesheet" href="{{BASE}}/assets/doorway.css?v={{ASSET_VERSION}}">
  <script defer src="{{BASE}}/assets/doorway.js?v={{ASSET_VERSION}}"></script>
</head>
<body>
  <main class="universe-doorway" aria-label="Enter the Cosmic Aquaria universe" data-base="{{BASE}}">
    <div class="doorway-nebula" aria-hidden="true"></div>
    <img class="doorway-flower doorway-flower--left" src="{{BASE}}/assets/flowers/anemone.png" alt="" aria-hidden="true">
    <img class="doorway-flower doorway-flower--right" src="{{BASE}}/assets/flowers/cosmos.png" alt="" aria-hidden="true">
    <header class="doorway-title"><span class="doorway-mark" aria-hidden="true"><i></i></span><h1>COSMIC<br>AQUARIA</h1><p>ENTER WITHOUT KNOWING.</p></header>
    <div class="doorway-field">
      <button type="button" class="doorway-bubble doorway-bubble--heavy" data-water="heavy" style="--home-x:22%;--home-y:28%;--bubble-size:104px" aria-label="Drift into a random heavy Aquarium"><span>HEAVY</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--dreamy" data-water="dreamy" style="--home-x:78%;--home-y:28%;--bubble-size:104px" aria-label="Drift into a random dreamy Aquarium"><span>DREAMY</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--quiet" data-water="quiet" style="--home-x:16%;--home-y:48%;--bubble-size:98px" aria-label="Drift into a random quiet Aquarium"><span>QUIET</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--anywhere" data-water="anywhere" style="--home-x:50%;--home-y:48%;--bubble-size:176px" aria-label="Drift anywhere into a random published Aquarium"><span>DRIFT<br>ANYWHERE</span><i aria-hidden="true">→</i></button>
      <button type="button" class="doorway-bubble doorway-bubble--electronic" data-water="electronic" style="--home-x:84%;--home-y:48%;--bubble-size:104px" aria-label="Drift into a random electronic Aquarium"><span>ELECTRONIC</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--dark" data-water="dark" style="--home-x:24%;--home-y:69%;--bubble-size:106px" aria-label="Drift into a random dark Aquarium"><span>DARK</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--loud" data-water="loud" style="--home-x:76%;--home-y:69%;--bubble-size:106px" aria-label="Drift into a random loud Aquarium"><span>LOUD</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--strange" data-water="strange" style="--home-x:50%;--home-y:79%;--bubble-size:102px" aria-label="Drift into a random strange Aquarium"><span>STRANGE</span></button>
    </div>
    <footer class="doorway-footer"><span>TOUCH SOMETHING</span><p>Let the Music find you</p></footer>
    <p class="visually-hidden" role="status" aria-live="polite">Choose a water, or drift anywhere.</p>
  </main>
</body>
</html>
