name: Publish Approved Festival Machine

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Festival candidate branch created by the integrated Factory
        required: true
        type: string
      festival_slug:
        description: Canonical Festival Machine slug
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: festival-machine-production
  cancel-in-progress: false

jobs:
  validate-publish-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate Factory request
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          FESTIVAL_SLUG: ${{ inputs.festival_slug }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^codex/festival-[a-z0-9]+(-[a-z0-9]+)*-[0-9]{14}$ ]]
          [[ "$FESTIVAL_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - name: Rebase onto current production
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          git config user.name "AGGITS Artist Machine Factory"
          git config user.email "artist-machine-factory@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin "HEAD:$CANDIDATE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-automation.txt
      - name: Validate reviewed Festival Machine
        shell: bash
        env:
          FESTIVAL_SLUG: ${{ inputs.festival_slug }}
        run: |
          set -euo pipefail
          test -f "automation/festival-machines/$FESTIVAL_SLUG.json"
          python -m unittest tests.festival_discovery_test tests.create_festival_machine_test tests.festival_projects_test
      - name: Build production site
        run: node --experimental-strip-types scripts/build-github-pages.mjs
      - name: Verify shared machine and reporting behaviour
        run: npm test
      - name: Promote passing candidate to main
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin --delete "$CANDIDATE_REF"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Deploy approved Festival Machine
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Sync reporting inventory
        env:
          COSMIC_WORKER_SYNC_TOKEN: ${{ secrets.COSMIC_WORKER_SYNC_TOKEN }}
        run: node scripts/sync-artist-machine-reporting.mjs
