name: Publish Approved Artist Machine

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Factory candidate branch created by the desktop dashboard
        required: true
        type: string
      artist_slug:
        description: Canonical Artist Machine slug
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: artist-machine-production
  cancel-in-progress: false

jobs:
  validate-publish-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate factory request
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          ARTIST_SLUG: ${{ inputs.artist_slug }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^codex/factory-[a-z0-9]+(-[a-z0-9]+)*-[0-9]{14}$ ]]
          [[ "$ARTIST_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - name: Rebase onto current production
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin "HEAD:$CANDIDATE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install factory verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-automation.txt
      - name: Validate approved machine
        run: python scripts/artist_machine_factory.py check --slug "${{ inputs.artist_slug }}"
      - name: Build production site
        run: node --experimental-strip-types scripts/build-github-pages.mjs
      - name: Run application tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/*.test.ts
          python -m unittest tests.artist_machine_factory_test
      - name: Promote passing candidate to main
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin --delete "$CANDIDATE_REF"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Deploy approved Artist Machine
        id: deployment
        uses: actions/deploy-pages@v4
