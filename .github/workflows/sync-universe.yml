name: Sync Cosmic Aquaria Universe Index

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-aquarium-universe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync the published catalogue to random discovery
        env:
          COSMIC_WORKER_SYNC_TOKEN: ${{ secrets.COSMIC_WORKER_SYNC_TOKEN }}
        run: node scripts/sync-worker.mjs
