name: Create or Refresh Location Library

on:
  workflow_dispatch:
    inputs:
      location:
        description: Specific place, such as Portland, Oregon
        required: true
        type: string
      max_artists:
        description: Maximum verified artists to research
        required: true
        default: "25"
        type: string
      genre:
        description: Optional genre hint
        required: false
        type: string
      build_missing:
        description: Create canonical Artist Aquariums for newly verified artists
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cosmic-aquarium-publishing
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site verification dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-automation.txt
      - name: Research and verify the location
        shell: bash
        env:
          LOCATION: ${{ inputs.location }}
          MAX_ARTISTS: ${{ inputs.max_artists }}
          GENRE: ${{ inputs.genre }}
          BUILD_MISSING: ${{ inputs.build_missing }}
        run: |
          set -euo pipefail
          arguments=(--location "$LOCATION" --max-artists "$MAX_ARTISTS")
          if [[ -n "$GENRE" ]]; then arguments+=(--genre "$GENRE"); fi
          if [[ "$BUILD_MISSING" == "true" ]]; then arguments+=(--build-missing); fi
          python scripts/location_collections.py "${arguments[@]}"
      - name: Build and verify the complete public site
        run: |
          node --experimental-strip-types scripts/build-github-pages.mjs
          npm test
          npm run typecheck
          python -m unittest discover -s tests -p "*_test.py"
      - name: Commit the location and any new canonical artists
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Cosmic Aquaria Location Research"
          git config user.email "cosmic-aquarium@users.noreply.github.com"
          git add automation github-pages
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${{ inputs.location }} location library"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Publish permanent Location and Artist URLs
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Sync canonical artists and parent collections
        env:
          COSMIC_WORKER_SYNC_TOKEN: ${{ secrets.COSMIC_WORKER_SYNC_TOKEN }}
        run: node scripts/sync-worker.mjs
