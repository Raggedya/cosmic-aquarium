name: Build Things To Do Machine for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/things_to_do_machine.py
      - desktop/tourism_config.py
      - desktop/ThingsToDoMachine.spec
      - desktop/create_things_to_do_icon.py
      - desktop/build-things-to-do-machine.ps1
      - data/tourism/**
      - .github/workflows/build-tourism-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: powershell -ExecutionPolicy Bypass -File desktop/build-things-to-do-machine.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: things-to-do-machine-windows
          path: desktop-dist/ThingsToDoMachine.exe
          if-no-files-found: error
          retention-days: 30
