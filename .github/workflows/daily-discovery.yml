name: Daily Cosmic Aquaria Discovery

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      batch_date:
        description: Optional UTC date (YYYY-MM-DD); blank uses today
        required: false
        type: string
      target_count:
        description: Number of Aquariums to publish (production is 20)
        required: false
        default: "20"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cosmic-aquarium-publishing
  cancel-in-progress: false

jobs:
  discover-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install Bandcamp import dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-automation.txt
      - name: Discover and generate the daily batch
        id: batch
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.batch_date }}
          REQUESTED_TARGET: ${{ inputs.target_count }}
        run: |
          set -euo pipefail
          batch_date="${REQUESTED_DATE:-$(date -u +%F)}"
          target_count="${REQUESTED_TARGET:-20}"
          python scripts/daily_discovery.py --date "$batch_date" --target "$target_count" | tee daily-result.json
          echo "batch_date=$batch_date" >> "$GITHUB_OUTPUT"
          echo "target_count=$target_count" >> "$GITHUB_OUTPUT"
      - name: Rebuild permanent pages and catalogue
        run: |
          python scripts/generate_universe_qr.py
          npm run build:pages
      - name: Verify generated application
        run: |
          npm test
          node --check services/cosmic-worker/src/index.js
          python -m py_compile scripts/create_artist.py scripts/daily_discovery.py scripts/water_classifier.py scripts/generate_universe_qr.py
      - name: Commit generated releases and recoverable batch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Cosmic Aquaria Discovery"
          git config user.email "cosmic-aquaria@users.noreply.github.com"
          git add automation github-pages
          if git diff --cached --quiet; then
            echo "Daily batch is already current."
          else
            git commit -m "Publish Cosmic Aquaria batch ${{ steps.batch.outputs.batch_date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Publish permanent Aquarium URLs
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Add the published collection to universe discovery
        env:
          COSMIC_WORKER_SYNC_TOKEN: ${{ secrets.COSMIC_WORKER_SYNC_TOKEN }}
          BATCH_DATE: ${{ steps.batch.outputs.batch_date }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalogue=JSON.parse(fs.readFileSync('github-pages/aquariums.json','utf8'));
          const batch=JSON.parse(fs.readFileSync(`automation/batches/${process.env.BATCH_DATE}.json`,'utf8'));
          const response=await fetch('https://cosmic-aquaria.andrewharris501.workers.dev/api/admin/sync',{
            method:'POST',
            headers:{authorization:`Bearer ${process.env.COSMIC_WORKER_SYNC_TOKEN}`,'content-type':'application/json'},
            body:JSON.stringify({aquariums:catalogue.aquariums,batch,fullReplace:false}),
          });
          if(!response.ok) throw new Error(`Universe discovery sync failed: ${response.status}`);
          NODE
      - name: Require the complete daily collection
        shell: bash
        env:
          BATCH_DATE: ${{ steps.batch.outputs.batch_date }}
          TARGET_COUNT: ${{ steps.batch.outputs.target_count }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          batch=json.loads(pathlib.Path(f"automation/batches/{os.environ['BATCH_DATE']}.json").read_text())
          target=int(os.environ['TARGET_COUNT'])
          if batch.get("publishedCount",0) < target:
              raise SystemExit(f"Batch has {batch.get('publishedCount',0)} of {target}; its state is saved and the next run can resume.")
          PY
