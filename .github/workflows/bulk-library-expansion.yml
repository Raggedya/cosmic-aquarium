name: Cosmic Aquaria Bulk Library Expansion

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: Bulk batch number (1-10)
        required: true
        default: "1"
        type: string
      dry_run:
        description: Validate 500 artists without publishing
        required: true
        default: true
        type: boolean
      candidate_limit:
        description: Candidate window (1000-1500)
        required: true
        default: "1000"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cosmic-aquarium-publishing
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-automation.txt
      - name: Resolve safe batch target
        id: batch
        shell: bash
        env:
          REQUESTED_BATCH: ${{ inputs.batch_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_BATCH" =~ ^([1-9]|10)$ ]]; then
            echo "batch_number must be between 1 and 10" >&2
            exit 1
          fi
          batch_number="$(printf '%02d' "$REQUESTED_BATCH")"
          python scripts/bulk_library_status.py --output bulk-status.json
          remaining="$(python -c 'import json; print(json.load(open("bulk-status.json"))["remainingToTarget"])')"
          if (( remaining <= 0 )); then
            echo "The 5,000-artist target is already complete."
            exit 1
          fi
          target=$(( remaining < 500 ? remaining : 500 ))
          suffix=""
          if [[ "$DRY_RUN" == "true" ]]; then suffix="-dry-run"; fi
          echo "batch_id=bulk-5000-batch-${batch_number}${suffix}" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Require a completed dry run before publishing
        if: inputs.dry_run == false
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          TARGET: ${{ steps.batch.outputs.target }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          report = pathlib.Path("automation/bulk/reports") / f"{os.environ['BATCH_ID']}-dry-run.json"
          if not report.exists():
              raise SystemExit(f"Missing required dry-run report: {report}")
          data = json.loads(report.read_text())
          if data.get("status") != "complete" or data.get("acceptedNewArtists", 0) < int(os.environ["TARGET"]):
              raise SystemExit("The matching dry run has not passed its acceptance target.")
          PY
      - name: Run or resume the batch
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          TARGET: ${{ steps.batch.outputs.target }}
          CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--batch-id "$BATCH_ID" --target-accepted "$TARGET" --candidate-limit "$CANDIDATE_LIMIT")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python scripts/bulk_expand_library.py "${args[@]}" | tee bulk-result.json
      - name: Rebuild public catalogue
        if: inputs.dry_run == false
        run: npm run build:pages
      - name: Run catalogue and application QA
        run: |
          npm test
          python -m unittest discover -s tests -p '*_test.py'
          node --check services/cosmic-worker/src/index.js
          python -m py_compile scripts/create_artist.py scripts/daily_discovery.py scripts/backfill_ticker_bios.py scripts/bulk_expand_library.py scripts/bulk_library_status.py scripts/qa_bulk_batch.py scripts/water_classifier.py
      - name: Require the complete accepted batch
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          TARGET: ${{ steps.batch.outputs.target }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path("automation/bulk/reports") / f"{os.environ['BATCH_ID']}.json").read_text())
          if report.get("status") != "complete" or report.get("acceptedNewArtists", 0) != int(os.environ["TARGET"]):
              raise SystemExit(f"Batch QA failed: {report.get('acceptedNewArtists', 0)} / {os.environ['TARGET']} accepted")
          PY
      - name: Audit all accepted records and sample 25 live releases
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: python scripts/qa_bulk_batch.py --batch-id "$BATCH_ID" --network-sample 25 --output "automation/bulk/reports/${BATCH_ID}-qa.json"
      - name: Save batch state and any published catalogue
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          set -euo pipefail
          git config user.name "Cosmic Aquaria Expansion"
          git config user.email "cosmic-aquaria@users.noreply.github.com"
          git add automation/bulk github-pages
          if git diff --cached --quiet; then
            echo "Batch state is already current."
          else
            git commit -m "Expand Cosmic Aquaria library — ${BATCH_ID}"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: inputs.dry_run == false
      - uses: actions/upload-pages-artifact@v3
        if: inputs.dry_run == false
        with:
          path: github-pages
      - name: Publish expanded catalogue
        id: deployment
        if: inputs.dry_run == false
        uses: actions/deploy-pages@v4
      - name: Sync the complete catalogue to the Worker
        if: inputs.dry_run == false
        continue-on-error: true
        env:
          COSMIC_WORKER_SYNC_TOKEN: ${{ secrets.COSMIC_WORKER_SYNC_TOKEN }}
          FULL_REPLACE: "true"
        run: node scripts/sync-worker.mjs
