name: Build Cosmic Aquarium Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - public/flowers/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==12.3.0 pyinstaller==6.22.2
      - run: python desktop/create_icon.py
      - run: python -m PyInstaller --noconfirm --clean desktop/CosmicAquariumStudio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-aquarium-studio-windows
          path: dist/Cosmic Aquarium Studio.exe
          if-no-files-found: error
          retention-days: 30
