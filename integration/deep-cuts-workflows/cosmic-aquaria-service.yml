name: Deploy Cosmic Aquaria Service

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * 1"

permissions:
  contents: read

concurrency:
  group: cosmic-aquaria-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cosmic Aquaria
        uses: actions/checkout@v4
        with:
          repository: Raggedya/cosmic-aquarium
          path: cosmic-aquaria
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate or create the private analytics database
        id: database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const headers = { authorization: `Bearer ${token}`, 'content-type': 'application/json' };
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const list = await fetch(base + '?name=cosmic-aquaria-production', { headers }).then(r => r.json());
          if (!list.success) throw new Error(JSON.stringify(list.errors));
          let database = list.result.find(item => item.name === 'cosmic-aquaria-production');
          if (!database) {
            const created = await fetch(base, { method: 'POST', headers, body: JSON.stringify({ name: 'cosmic-aquaria-production', primary_location_hint: 'oc' }) }).then(r => r.json());
            if (!created.success) throw new Error(JSON.stringify(created.errors));
            database = created.result;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${database.uuid}\n`);
          NODE
      - name: Prepare Worker configuration
        working-directory: cosmic-aquaria/services/cosmic-worker
        env:
          D1_DATABASE_ID: ${{ steps.database.outputs.id }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('wrangler.generated.jsonc',fs.readFileSync('wrangler.template.jsonc','utf8').replace('__D1_DATABASE_ID__',process.env.D1_DATABASE_ID))"
      - name: Apply idempotent database migration
        working-directory: cosmic-aquaria/services/cosmic-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 execute cosmic-aquaria-production --remote --file=migrations/0001_initial.sql --config wrangler.generated.jsonc --yes
      - name: Configure private service values
        working-directory: cosmic-aquaria/services/cosmic-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.DEEP_CUTS_ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
        run: |
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put ADMIN_TOKEN --config wrangler.generated.jsonc
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY --config wrangler.generated.jsonc
          printf '%s' "$OWNER_EMAIL" | npx --yes wrangler@4 secret put OWNER_EMAIL --config wrangler.generated.jsonc
          printf '%s' "$REPORT_FROM_EMAIL" | npx --yes wrangler@4 secret put REPORT_FROM_EMAIL --config wrangler.generated.jsonc
      - name: Deploy the service
        working-directory: cosmic-aquaria/services/cosmic-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.generated.jsonc
      - name: Sync the published Aquarium catalogue
        env:
          ADMIN_TOKEN: ${{ secrets.DEEP_CUTS_ADMIN_TOKEN }}
        run: |
          node <<'NODE'
          const catalogue = await fetch('https://raggedya.github.io/cosmic-aquarium/aquariums.json', { cache: 'no-store' }).then(r => r.json());
          const response = await fetch('https://cosmic-aquaria.andrewharris501.workers.dev/api/admin/sync', {
            method: 'POST', headers: { authorization: `Bearer ${process.env.ADMIN_TOKEN}`, 'content-type': 'application/json' },
            body: JSON.stringify({ aquariums: catalogue.aquariums || [] }),
          });
          if (!response.ok) throw new Error(await response.text());
          console.log(await response.text());
          NODE
      - name: Verify service health
        run: curl --fail --silent --show-error https://cosmic-aquaria.andrewharris501.workers.dev/api/health
