<!doctype html>
<html lang="en" data-artist="phenomenon-i-see-you" data-version="1802030f09ec">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#01040d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cosmic Aquaria — phenomenon</title>
  <meta name="description" content="Catch a flower, reveal a phenomenon song, and continue listening on Bandcamp.">
  <script>
    (() => {
      const viewport = window.visualViewport;
      const height = Math.max(window.innerHeight || 0, viewport?.height || 0);
      document.documentElement.style.setProperty('--aquarium-height', Math.ceil(height) + 'px');
      document.documentElement.style.setProperty('--viewport-top', Math.round(Math.max(0, viewport?.offsetTop || 0)) + 'px');
    })();
  </script>
  <link rel="stylesheet" href="/cosmic-aquarium/assets/site.css?v=1802030f09ec">
</head>
<body>
  <header class="cosmic-title" style="position:fixed;z-index:2147483647;top:calc(var(--viewport-top,0px) + max(20px,env(safe-area-inset-top)));left:50%;width:min(430px,100vw);display:block;visibility:visible;opacity:1;color:#f5f2ed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;pointer-events:none;transform:translateX(-50%);filter:none;mix-blend-mode:normal">
    <span aria-hidden="true" class="cosmic-mark"><i></i></span>
    <h1 style="margin:0;padding-left:.38em;color:#f5f2ed;font-size:13px;font-weight:500;letter-spacing:.38em">PHENOMENON</h1>
    <p style="margin:9px 0 0;color:rgba(235,241,255,.56);font-size:7px;font-weight:650;letter-spacing:.24em">TOUCH SOMETHING.</p>
  </header>
  <main class="cosmic-aquarium" data-theme="cosmic" aria-label="Cosmic Aquaria music discovery experience">
    <div class="cosmic-atmosphere" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
      <span class="distant-swarm"><b></b><b></b><b></b><b></b><b></b></span>
    </div>
    <div class="creature-field" aria-label="Unknown song flowers"></div>
    <div class="capture-transition" aria-hidden="true" hidden>
      <i class="capture-point"></i><i class="capture-ring"></i><i class="capture-pulse"></i>
    </div>
    <section class="living-player" aria-labelledby="living-player-title" hidden>
      <img class="player-membrane" alt="" aria-hidden="true">
      <div class="player-copy"><p></p><h2 id="living-player-title"></h2><span></span></div>
      <div class="organic-progress" aria-hidden="true"><i></i><span>STREAM</span><b></b></div>
      <div class="bandcamp-stream"><span>TOUCH PLAY TO STREAM</span><iframe title="Official Bandcamp player" loading="eager" allow="autoplay"></iframe></div>
      <p class="stream-unavailable" hidden>Streaming is unavailable here. Continue on Bandcamp.</p>
      <a class="bandcamp-link" target="_blank" rel="noopener noreferrer">VIEW &amp; SUPPORT ON BANDCAMP ↗</a>
      <button class="release-current" type="button" aria-label="Release this song back into the aquarium"><i aria-hidden="true"></i><span>RELEASE</span></button>
    </section>
    <nav class="aquarium-actions aquarium-secondary-actions" aria-label="Aquarium actions">
      <button class="aquarium-action aquarium-action--share" type="button" aria-label="Share this Aquarium">
        <span class="aquarium-action-orbit" aria-hidden="true"><img src="/cosmic-aquarium/assets/flowers/anemone.png" alt=""></span>
        <strong>SHARE<br>AQUARIUM</strong>
      </button>
      <a class="aquarium-action aquarium-action--buy aquarium-buy-action" target="_blank" rel="noopener noreferrer" hidden>
        <span class="aquarium-action-orbit" aria-hidden="true"><img src="/cosmic-aquarium/assets/flowers/cosmos.png" alt=""></span>
        <span><strong>BUY MUSIC</strong><small>SUPPORT THE ARTIST</small></span>
      </a>
      <button class="aquarium-action aquarium-action--explore" type="button" aria-label="Explore another random Aquarium">
        <span class="aquarium-action-orbit" aria-hidden="true"><img src="/cosmic-aquarium/assets/flowers/cosmos.png" alt=""></span>
        <strong>EXPLORE<br>ANOTHER<br>AQUARIUM</strong>
      </button>
    </nav>
    <p class="cosmic-legal">INDEPENDENT &amp; UNOFFICIAL · LISTENING AND SUPPORT REMAIN ON BANDCAMP</p>
    <p class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
  <script src="/cosmic-aquarium/assets/site.js?v=1802030f09ec" defer></script>
</body>
</html>
