<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050314">
  <meta name="description" content="Enter Cosmic Aquaria and let independent music find you.">
  <title>Cosmic Aquaria — Touch Something</title>
  <link rel="stylesheet" href="/cosmic-aquarium/assets/doorway.css?v=252d70ae26e9">
  <script defer src="/cosmic-aquarium/assets/doorway.js?v=252d70ae26e9"></script>
</head>
<body>
  <main class="universe-doorway" aria-label="Enter the Cosmic Aquaria universe" data-base="/cosmic-aquarium">
    <img class="doorway-background" src="/cosmic-aquarium/assets/doorway/cosmic-depth.webp" alt="" aria-hidden="true">
    <div class="doorway-nebula" aria-hidden="true"></div>
    <img class="doorway-botanicals doorway-botanicals--crown" src="/cosmic-aquarium/assets/doorway/botanical-crown.webp" alt="" aria-hidden="true">
    <img class="doorway-botanicals doorway-botanicals--garden" src="/cosmic-aquarium/assets/doorway/botanical-garden.webp" alt="" aria-hidden="true">
    <header class="doorway-title"><span class="doorway-mark" aria-hidden="true"><i></i></span><h1>COSMIC<br>AQUARIA</h1><p>TOUCH SOMETHING.</p></header>
    <div class="doorway-field">
      <button type="button" class="doorway-bubble doorway-bubble--heavy" data-water="heavy" style="--home-x:25%;--home-y:30%;--bubble-size:177px" aria-label="Drift into a random heavy Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-heavy.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">HEAVY</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--dreamy" data-water="dreamy" style="--home-x:75%;--home-y:30%;--bubble-size:177px" aria-label="Drift into a random dreamy Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-dreamy.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">DREAMY</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--quiet" data-water="quiet" style="--home-x:18%;--home-y:48%;--bubble-size:168px" aria-label="Drift into a random quiet Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-quiet.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">QUIET</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--anywhere" data-water="anywhere" style="--home-x:50%;--home-y:48%;--bubble-size:212px" aria-label="Drift anywhere into a random published Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-anywhere.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">DRIFT<br>ANYWHERE</span><i aria-hidden="true">→</i></button>
      <button type="button" class="doorway-bubble doorway-bubble--electronic" data-water="electronic" style="--home-x:82%;--home-y:48%;--bubble-size:177px" aria-label="Drift into a random electronic Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-electronic.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">ELECTRONIC</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--dark" data-water="dark" style="--home-x:25%;--home-y:67%;--bubble-size:177px" aria-label="Drift into a random dark Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-dark.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">DARK</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--loud" data-water="loud" style="--home-x:75%;--home-y:67%;--bubble-size:177px" aria-label="Drift into a random loud Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-loud.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">LOUD</span></button>
      <button type="button" class="doorway-bubble doorway-bubble--strange" data-water="strange" style="--home-x:50%;--home-y:76%;--bubble-size:168px" aria-label="Drift into a random strange Aquarium"><img class="doorway-bubble__world" src="/cosmic-aquarium/assets/doorway/world-strange.webp" alt="" aria-hidden="true" draggable="false"><span class="doorway-bubble__label">STRANGE</span></button>
    </div>
    <footer class="doorway-footer"><p>Let the Music find you</p></footer>
    <p class="visually-hidden" role="status" aria-live="polite">Choose a water, or drift anywhere.</p>
  </main>
</body>
</html>
