<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#01040d">
  <title>Cosmic Aquaria</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#01040d;color:#f5f2ed;font-family:Inter,ui-sans-serif,system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#101f52,transparent 34%),#01040d}.recovery{padding:32px}.mark{display:block;width:32px;height:32px;margin:0 auto 22px;border:1px solid #8994b1;border-radius:50%}h1{margin:0;font-size:14px;font-weight:500;letter-spacing:.38em}p{margin:14px 0 0;color:#8994b1;font-size:8px;font-weight:650;letter-spacing:.22em}a{display:inline-block;margin-top:30px;color:#c7b8f4;font-size:9px;letter-spacing:.16em;text-decoration:none}
  </style>
</head>
<body>
  <main class="recovery">
    <span class="mark" aria-hidden="true"></span>
    <h1>COSMIC AQUARIA</h1>
    <p>FINDING YOUR AQUARIUM…</p>
    <a href="/cosmic-aquarium/">RETURN TO COSMIC AQUARIA</a>
  </main>
  <script>
    (() => {
      const base = '/cosmic-aquarium';
      const relative = location.pathname.startsWith(base) ? location.pathname.slice(base.length) : location.pathname;
      const pieces = relative.split('/').filter(Boolean);
      const slug = pieces[0] === 'artists' ? pieces[1] : pieces[0];
      if (!slug || slug.includes('.')) return;
      fetch(base + '/artists/' + encodeURIComponent(slug) + '.json', { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('Unknown edition');
          location.replace(base + '/' + encodeURIComponent(slug) + '/' + location.search + location.hash);
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
