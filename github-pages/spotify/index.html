<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050503">
  <title>AGGITS — Spotify + Bandcamp Music Discovery Machine</title>
  <meta name="description" content="Pull the AGGITS mechanical jukebox to discover an artist, listen on Spotify, and explore their Bandcamp catalogue.">
  <link rel="canonical" href="https://raggedya.github.io/cosmic-aquarium/spotify/">
  <link rel="preload" as="image" href="/cosmic-aquarium/assets/music-machine/aggits-spotify-bandcamp-canonical.png">
  <link rel="stylesheet" href="/cosmic-aquarium/assets/spotify-machine.css?v=781f302e3ed9">
</head>
<body>
  <main class="spotify-machine" data-base="/cosmic-aquarium" data-machine-state="BOOT" aria-label="AGGITS Spotify and Bandcamp music discovery machine">
    <div class="machine-stage">
      <img class="canonical-skin" src="/cosmic-aquarium/assets/music-machine/aggits-spotify-bandcamp-canonical.png" width="1024" height="1536" alt="" draggable="false">

      <header class="title-window">
        <h1>AGGITS</h1>
        <p>MUSIC DISCOVERY MACHINE</p>
      </header>

      <div class="meter-window meter-window--left" aria-hidden="true"><span>L</span><i></i></div>
      <div class="meter-window meter-window--right" aria-hidden="true"><span>R</span><i></i></div>
      <button class="sound-control" type="button" data-action="sound" aria-pressed="true">SOUND<br>ON</button>

      <section class="reel-window" aria-label="Single artist discovery reel">
        <div class="reel">
          <div class="reel-strip" aria-live="polite">
            <div class="reel-card"><span>READY</span></div>
            <div class="reel-card"><span>PULL THE LEVER</span></div>
            <div class="reel-card"><span>DISCOVER</span></div>
          </div>
        </div>
      </section>

      <section class="player-bay" aria-label="Official Spotify player bay">
        <iframe title="Spotify player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        <div class="player-shutter" data-player-shutter>
          <span class="result-kicker">DISCOVERY READY</span>
          <strong data-result-artist>PULL THE LEVER</strong>
          <span data-result-track>Spotify opens here after the reel locks.</span>
        </div>
      </section>

      <a class="machine-action machine-action--bandcamp is-disabled" data-action="bandcamp" aria-disabled="true">BUY / EXPLORE<br>ON BANDCAMP</a>
      <button class="machine-action machine-action--spin" type="button" data-action="spin-again">SPIN<br>AGAIN</button>
      <a class="machine-action machine-action--spotify is-disabled" data-action="spotify" aria-disabled="true">OPEN IN<br>SPOTIFY</a>

      <button class="lever" type="button" aria-label="Pull the lever to discover an artist">
        <img src="/cosmic-aquarium/assets/music-machine/aggits-lever.webp" alt="" draggable="false">
        <span>PULL</span>
      </button>

      <p class="machine-status" aria-live="polite">Loading the discovery library…</p>
    </div>
  </main>
  <script type="module" src="/cosmic-aquarium/assets/spotify-machine.js?v=781f302e3ed9"></script>
</body>
</html>
